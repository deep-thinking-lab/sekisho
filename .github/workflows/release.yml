name: Release

# Build only. A v* tag builds the archives and an unsigned SHA256SUMS and
# attaches them, with install.sh, to a DRAFT release. CI never signs, never
# publishes and never replaces an asset. The release signing key lives offline
# with the maintainer, who signs SHA256SUMS and install.sh by hand, uploads the
# .minisig files and publishes the draft.
# See docs/decisions/0001-offline-release-signing.md.

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Refuse release signing in CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if any workflow references a MINISIGN_* secret or signs
        run: scripts/check-release-signing.sh

      - name: Validate the release tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
            echo "::error::unsupported release tag: $VERSION"
            exit 64
          }

  build:
    name: Build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1, master 2026-10-15
        with:
          toolchain: "1.94.1"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build and package
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: scripts/release/local-build.sh "$VERSION"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  draft:
    name: Create unsigned draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if any workflow references a MINISIGN_* secret or signs
        run: scripts/check-release-signing.sh

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Write unsigned checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum sekisho-*.tar.gz > SHA256SUMS)
          cp install.sh dist/install.sh
          cat dist/SHA256SUMS

      - name: Create or fill the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
            echo "::error::unsupported release tag: $VERSION"
            exit 64
          }
          assets=(dist/*.tar.gz dist/SHA256SUMS dist/install.sh)
          if state="$(gh release view "$VERSION" --json isDraft,assets \
            --jq '"\(.isDraft) \(.assets | length)"' 2>&1)"; then
            read -r is_draft asset_count <<<"$state"
            if [ "$is_draft" != "true" ]; then
              echo "::error::release $VERSION is already published. CI never changes a published release."
              exit 1
            fi
            if [ "$asset_count" != "0" ]; then
              echo "::error::draft release $VERSION already has $asset_count assets. CI never replaces a release asset. Delete the draft (or its assets) by hand, then re-run this workflow."
              exit 1
            fi
            gh release upload "$VERSION" "${assets[@]}"
          else
            case "$state" in
              *"release not found"*) ;;
              *)
                echo "::error::cannot read release $VERSION: $state"
                exit 1
                ;;
            esac
            flags=(--draft --verify-tag --title "Sekisho $VERSION" --generate-notes)
            case "$VERSION" in
              *-*) flags+=(--prerelease) ;;
            esac
            gh release create "$VERSION" "${assets[@]}" "${flags[@]}"
          fi
          [ "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = "true" ] || {
            echo "::error::release $VERSION is not a draft after upload"
            exit 1
          }
          {
            echo "Draft release $VERSION holds unsigned assets."
            echo "The maintainer verifies them against a local build, signs SHA256SUMS and install.sh offline,"
            echo "uploads SHA256SUMS.minisig and install.sh.minisig by hand, then publishes the draft."
          } >>"$GITHUB_STEP_SUMMARY"
